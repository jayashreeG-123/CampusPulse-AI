
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse AI | Admin Setup</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101b3d, #263e70);
        }
        .card {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 35px #0004;
        }
        h1 { text-align: center; color: #172554; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin-top: 17px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .message { color: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Admin Setup</h1>
        <p>Create your first CampusPulse administrator account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('setup') }}">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <label>Admin Username</label>
            <input type="text" name="username" minlength="3" required>

            <label>Password</label>
            <input type="password" name="password" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" minlength="8" required>

            <button type="submit">Create Admin Account</button>
        </form>
    </div>
</body>
</html>
